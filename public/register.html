<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SISTec IoT Application 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl mb-4">Register</h2>
    <form action="/register" method="POST">
      <input type="text" name="name" placeholder="Name" class="w-full p-2 mb-4 border" required>
      <input type="email" name="email" placeholder="Email" class="w-full p-2 mb-4 border" required>
      <input type="password" name="password" placeholder="Password" class="w-full p-2 mb-4 border" required>
      <button type="submit" class="w-full bg-green-500 text-white p-2">Register</button>
    </form>
    <a href="/" class="text-blue-500 mt-4 block">Login</a>
  </div>
</body>
</html>
